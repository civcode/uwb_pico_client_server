name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host build + tests (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [host-debug, host-asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build catch2 libasio-dev

      - name: Verify golden vectors (specification-derived)
        run: tests/golden/verify.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (unit)
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Test (integration)
        run: ctest --preset ${{ matrix.preset }} -L integration --output-on-failure

  firmware-compile:
    name: Pico W firmware compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-12-dev-arm-none-eabi

      - name: Install Pico SDK
        run: |
          git clone --recursive https://github.com/raspberrypi/pico-sdk.git "$GITHUB_WORKSPACE/pico-sdk"
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset pico-w

      - name: Build
        run: cmake --build --preset pico-w

  # Hardware-in-the-loop jobs stay manual-only (implementation plan §2.4, §38).
  hil:
    name: HIL tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "HIL runs require self-hosted hardware; enable with -DUWB_ENABLE_HIL_TESTS=ON locally."
